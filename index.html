<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Сервер Flevoria</title>
    
    <style>
        /* Плавная прокрутка */
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* --- ВЕРХНЕЕ МЕНЮ (ПРОЗРАЧНОЕ) --- */
        .top-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: transparent;
            display: flex;
            align-items: center;            
            padding: 15px 40px;             
            box-sizing: border-box;
            z-index: 100;
        }

        /* СТИЛЬ ДЛЯ ЛОГОТИПА В ЛЕВОМ ВЕРХНЕМ УГЛУ */
        .logo {
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            border: 2px solid transparent; 
            padding: 6px 14px;
            border-radius: 6px;
            transition: 0.3s;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .logo:hover {
            background-color: transparent;
            color: white;
            border-color: transparent;
        }

        .nav-links {
            position: absolute;             
            left: 50%;                      
            transform: translateX(-50%);    
        }

        /* ССЫЛКИ В МЕНЮ */
        .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 18px;
            margin: 0 20px;                 
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: white;
        }

        /* --- ГЛАВНЫЙ ЭКРАН --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            background-image: url('https://i.postimg.cc/jqF2tVPy/image.png');
            background-size: cover;
            background-position: center;
        }

        .hero h2 {
            font-size: 40px;
            margin: 0;
            font-weight: normal;
            color: #e2e8f0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .hero h1 {
            font-size: 80px;
            margin: 0;
            letter-spacing: 5px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
        }

        /* --- СЕКЦИИ --- */
        .section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .section h2 {
            font-size: 50px;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* 1. СЕКЦИЯ ЗАГРУЗИТЬ (НОВЫЙ ФОН) */
        #download {
            background-image: url('https://i.postimg.cc/MpkGfy9F/a.png');
            background-size: cover;
            background-position: center;
        }

        /* 2. СЕКЦИЯ ССЫЛКИ / КОНТАКТЫ */
        #links { 
            background-image: url('https://i.postimg.cc/76PhYwKg/2026-10-04-22-53-14.png');
            background-size: cover;
            background-position: center;
        }

        /* 3. СЕКЦИЯ О НАС */
        #about {
            background-image: url('https://i.postimg.cc/rwWKfhD3/2026-10-01-23-44-32.png');
            background-size: cover;
            background-position: center;
        }

        #about .text-box {
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* КНОПКИ */
        .btn {
            background-color: transparent;
            color: white;
            border: 2px solid white;
            text-decoration: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            transition: 0.3s;
            display: inline-block;
        }

        .btn:hover {
            background-color: white;
            color: #0f172a;
            text-shadow: none;
        }

        .text-box {
            max-width: 600px;
            text-align: center;
            font-size: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЕЕ МЕНЮ -->
    <div class="top-menu">
        <a href="#hero" class="logo">FLEVORIA</a>

        <div class="nav-links">
            <a href="#download">Загрузить</a>
            <a href="#links">Ссылки</a>
            <a href="#about">О нас</a>
        </div>
    </div>

    <!-- 0. ГЛАВНЫЙ ЭКРАН -->
    <div id="hero" class="hero">
        <h2>WELCOME TO</h2>
        <h1>FLEVORIA</h1>
    </div>

    <!-- 1. БЛОК ЗАГРУЗИТЬ -->
    <div id="download" class="section">
        <h2>Загрузить моды</h2>
        <div>
            <a href="https://drive.google.com/file/d/15jIvPFIDJHPShPokDcbO-_P3J_3RvF6O/view?usp=drive_link" target="_blank" class="btn">Гугл Диск</a>
            <a href="https://disk.yandex.ru/d/xOGR6j5OT-_JTg" target="_blank" class="btn">Яндекс Диск</a>
        </div>
    </div>

    <!-- 2. БЛОК ССЫЛКИ -->
    <div id="links" class="section">
        <h2>Наши контакты</h2>
        <div>
            <a href="https://discord.gg/fc6YaXEXBn" target="_blank" class="btn">Discord</a>
            <a href="https://t.me/RepublicFlevoria" target="_blank" class="btn">Telegram</a>
        </div>
        <p style="margin-top: 30px; font-size: 20px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);">Админ: <b>@wonkov</b></p>
    </div>

    <!-- 3. БЛОК О НАС -->
    <div id="about" class="section">
        <h2>О нас</h2>
        <div class="text-box">
            <p>Добро пожаловать на проект Flevoria! Мы создаём уютный сервер Minecraft для игры с друзьями и крутым сообществом.</p>
        </div>
    </div>

</body>
</html>
